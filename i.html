<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}
		div {
			background-color: red;
			height: 100px;
			width: 100px;
			background-image: url('img/visibility_password/visibility-black.svg');
			background-repeat: no-repeat;
			background-size: 25%;
			background-position: 100%;
			z-index: 9;
			position: relative;
		}

		input {
			width: inherit;
			background-image: url(img/visibility_password/visibility-black.svg);
			background-size: 20%;
			background-repeat: no-repeat;
			background-position: 100% 50%;

			height: inherit;
		}
	</style>
</head>
<body>
	<div>
		<input type="text">
	</div>
</body>
</html>
